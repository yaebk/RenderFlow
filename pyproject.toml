[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frameforge"
version = "0.2.0"
description = "Adaptive render-cache scheduler for any frame renderer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["video", "cache", "scheduler", "rendering", "timeline", "playback"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []          # the core is pure standard library

[project.optional-dependencies]
# Read timelines exported by editors (EDL, FCP XML, FCPXML, AAF, Kdenlive).
formats = ["opentimelineio>=0.17", "OpenTimelineIO-Plugins>=0.17"]
dev = ["pytest>=7.0", "opentimelineio>=0.17", "OpenTimelineIO-Plugins>=0.17"]

[tool.setuptools.packages.find]
include = ["frameforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
